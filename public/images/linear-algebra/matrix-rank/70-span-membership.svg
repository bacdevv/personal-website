<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title70 desc70">
<title id="title70">Testing span membership in three dimensions</title>
<desc id="desc70">A translucent plane shows the span of two basis vectors. A blue vector stays in that plane. An orange vector extends above the plane, increasing the rank.</desc>
<defs><marker id="endBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#60a5fa"/></marker>
<marker id="endGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#fbbf24"/></marker>
<marker id="endPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#c4b5fd"/></marker></defs>
<rect width="640" height="340" rx="12" fill="#172436"/>
<text x="25" y="29" font-size="17" font-family="system-ui,sans-serif" fill="#e2e8f0" font-weight="600">Lesson 70 · Does the vector add a new direction?</text>
<polygon points="290,114 536,205 320,312 73,220" fill="#2563eb" fill-opacity=".20" stroke="#7db6f9" stroke-width="1.6"/>
<path d="M301 247 L500 318" stroke="#6987a8" stroke-width="1" stroke-dasharray="5 5" opacity=".55"/>
<line x1="303" y1="225" x2="503" y2="299" stroke="#60a5fa" stroke-width="3.3" marker-end="url(#endBlue)"/>
<line x1="303" y1="225" x2="147" y2="285" stroke="#c4b5fd" stroke-width="3.3" marker-end="url(#endPurple)"/>
<line x1="303" y1="225" x2="337" y2="280" stroke="#60a5fa" stroke-width="4" marker-end="url(#endBlue)"/>
<line x1="303" y1="225" x2="337" y2="137" stroke="#fbbf24" stroke-width="4" marker-end="url(#endGold)"/>
<line x1="337" y1="137" x2="337" y2="280" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 6" opacity=".8"/>
<circle cx="303" cy="225" r="4.2" fill="#f8fafc"/>
<text x="316" y="221" font-size="13" fill="#e2e8f0" font-family="system-ui,sans-serif">0</text>
<text x="510" y="307" font-size="13" fill="#93c5fd" font-family="system-ui,sans-serif">e₁</text>
<text x="111" y="302" font-size="13" fill="#d8b4fe" font-family="system-ui,sans-serif">e₂</text>
<text x="348" y="285" font-size="13" fill="#93c5fd" font-family="system-ui,sans-serif">v: inside span(S)</text>
<text x="348" y="132" font-size="13" fill="#fcd34d" font-family="system-ui,sans-serif">w: outside span(S)</text>
<text x="28" y="74" font-size="12.5" fill="#cbd5e1" font-family="system-ui,sans-serif">S = [e₁, e₂]</text>
<text x="28" y="94" font-size="12.5" fill="#93c5fd" font-family="system-ui,sans-serif">rank(S) = 2</text>
<text x="28" y="114" font-size="12.5" fill="#fcd34d" font-family="system-ui,sans-serif">rank([S w]) = 3</text>
<text x="28" y="327" font-size="12" fill="#94a3b8" font-family="system-ui,sans-serif">A vector in the plane adds no rank; a vector outside adds one.</text>
</svg>